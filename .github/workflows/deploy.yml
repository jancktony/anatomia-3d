name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download anatomy model
        run: |
          rm -rf /tmp/human-atlas
          git clone --depth 1 https://github.com/ashemag/human-atlas.git /tmp/human-atlas
          mkdir -p public/models
          cp /tmp/human-atlas/public/models/atlas.json public/models/
          find /tmp/human-atlas/public/models -maxdepth 1 -type f -name '*.bin' -exec cp {} public/models/ \;
          find /tmp/human-atlas/public/models -maxdepth 1 -type f -name '*.bin.gz' -exec cp {} public/models/ \;
          test -s public/models/atlas.json
          test -n "$(find public/models -maxdepth 1 -type f -name '*.bin' -print -quit)"

      - name: Download female anatomy atlas
        run: |
          rm -rf /tmp/female-atlas
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/HiMahendraBeniwal/female-atlas.git /tmp/female-atlas
          cd /tmp/female-atlas
          git sparse-checkout init --no-cone
          git sparse-checkout set '/public/models/*' '/public/ATTRIBUTION.md'
          git checkout
          test -s public/models/atlas.json
          mkdir -p "$GITHUB_WORKSPACE/public/models/female"
          cp public/models/atlas.json "$GITHUB_WORKSPACE/public/models/female/"
          find public/models -maxdepth 1 -type f \( -name '*.bin' -o -name '*.bin.gz' \) -exec cp {} "$GITHUB_WORKSPACE/public/models/female/" \;
          test -n "$(find "$GITHUB_WORKSPACE/public/models/female" -maxdepth 1 -type f \( -name '*.bin' -o -name '*.bin.gz' \) -print -quit)"
          cp public/ATTRIBUTION.md "$GITHUB_WORKSPACE/public/models/female/ATTRIBUTION.md"

      - name: Download detailed muscle model
        run: |
          curl -L --fail --retry 3 -o public/models/detailed-muscles.glb https://raw.githubusercontent.com/JohanBellander/BodyExplorer/main/public/anatomy.glb
          curl -L --fail --retry 3 -o public/models/detailed-muscles.json https://raw.githubusercontent.com/JohanBellander/BodyExplorer/main/public/mesh_mapping.json
          curl -L --fail --retry 3 -o public/models/detailed-skeleton.glb https://raw.githubusercontent.com/JohanBellander/BodyExplorer/main/public/skeleton.glb

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare build version
        run: |
          printf '{"version":"%s"}\n' "$GITHUB_SHA" > public/version.json

      - name: Build
        run: npm run build

      - name: Inject build version into HTML
        run: sed -i "s/__BUILD_VERSION__/$GITHUB_SHA/g" dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Force a fresh Pages deployment after frontend updates.
