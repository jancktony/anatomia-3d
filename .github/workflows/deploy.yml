name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download anatomy model
        run: |
          rm -rf /tmp/human-atlas
          git clone --depth 1 https://github.com/ashemag/human-atlas.git /tmp/human-atlas
          mkdir -p public/models
          cp /tmp/human-atlas/public/models/atlas.json public/models/
          cp /tmp/human-atlas/public/models/*.bin public/models/
          cp /tmp/human-atlas/public/models/*.bin.gz public/models/

      - name: Download female anatomy atlas
        run: |
          rm -rf /tmp/female-atlas
          git clone --depth 1 https://github.com/HiMahendraBeniwal/female-atlas.git /tmp/female-atlas
          test -f /tmp/female-atlas/public/models/atlas.json
          mkdir -p public/models/female
          cp /tmp/female-atlas/public/models/atlas.json public/models/female/
          find /tmp/female-atlas/public/models -maxdepth 1 -type f \\
            \( -name '*.bin' -o -name '*.bin.gz' \) \\
            -exec cp {} public/models/female/ \\
            ;
          cp /tmp/female-atlas/public/ATTRIBUTION.md public/models/female/ATTRIBUTION.md

      - name: Download detailed muscle model
        run: |
          curl -L --fail --retry 3 -o public/models/detailed-muscles.glb https://raw.githubusercontent.com/JohanBellander/BodyExplorer/main/public/anatomy.glb
          curl -L --fail --retry 3 -o public/models/detailed-muscles.json https://raw.githubusercontent.com/JohanBellander/BodyExplorer/main/public/mesh_mapping.json
          curl -L --fail --retry 3 -o public/models/detailed-skeleton.glb https://raw.githubusercontent.com/JohanBellander/BodyExplorer/main/public/skeleton.glb

      - name: Install dependencies
        run: npm install

      - name: Prepare build version
        run: |
          printf '{"version":"%s"}\n' "$GITHUB_SHA" > public/version.json

      - name: Build
        run: npm run build

      - name: Inject build version into HTML
        run: sed -i "s/__BUILD_VERSION__/$GITHUB_SHA/g" dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Force a fresh Pages deployment after frontend updates.
