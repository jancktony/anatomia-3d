<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="theme-color" content="#ed5c9f"/>
  <meta name="description" content="Atlas humano 3D educativo e interactivo."/>
  <meta name="app-version" content="__BUILD_VERSION__"/>
  <link rel="manifest" href="./manifest.webmanifest"/>
  <title>Anatomía 3D — Atlas interactivo</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    (async () => {
      try {
        const meta = document.querySelector('meta[name="app-version"]');
        const current = meta?.content || '';
        if (current && current !== '__BUILD_VERSION__') {
          const response = await fetch('./version.json?t=' + Date.now(), { cache: 'no-store' });
          if (response.ok) {
            const data = await response.json();
            if (data.version && data.version !== current) {
              window.location.reload();
              return;
            }
          }
        }
      } catch (_) {}
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('/anatomia-3d/sw.js', { updateViaCache: 'none' });
          let reloaded = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (reloaded) return;
            reloaded = true;
            window.location.reload();
          });
          await registration.update();
          if (registration.waiting) registration.waiting.postMessage({ type: 'SKIP_WAITING' });
        } catch (error) {
          console.warn('No se pudo actualizar el modo offline:', error);
        }
      });
    }
  </script>
</body>
</html>
